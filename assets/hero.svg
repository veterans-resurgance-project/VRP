<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tree-lined landscape</title>
  <desc id="desc">Simplified illustrative landscape for Veterans Resurgence Project hero background.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f3a66" />
      <stop offset="100%" stop-color="#4b7fbf" />
    </linearGradient>
    <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#145214" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#sky)"/>
  <rect y="620" width="100%" height="280" fill="url(#ground)"/>
  <!-- simple stylized trees -->
  <g fill="#0b3a1d" opacity="0.9">
    <circle cx="220" cy="540" r="60" />
    <circle cx="320" cy="560" r="48" />
    <circle cx="420" cy="530" r="68" />
    <circle cx="980" cy="550" r="70" />
    <circle cx="1180" cy="540" r="60" />
    <circle cx="1360" cy="560" r="50" />
  </g>
  <!-- foreground silhouette -->
  <path d="M0 700 C150 650 300 680 480 700 C660 720 820 710 1000 700 C1180 690 1400 720 1600 700 L1600 900 L0 900 Z" fill="#123b1a" opacity="0.95"/>
</svg>
