<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Priority Ledger | VRP Command</title>
</head>
<body style="background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0;">

  <header style="background: #141f2c; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center;">
    <div>
      <span style="background: rgba(163,230,53,0.15); color: #a3e635; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.15em; padding: 0.3rem 0.8rem; border-radius: 20px; display: inline-block; margin-bottom: 0.3rem;">Operational Control</span>
      <h1 style="font-size: 1.5rem; margin: 0; color: #ffffff;">Internal Priority Ledger</h1>
    </div>
    <div>
      <a href="staff-portal.html" style="background: #334155; color: white; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 700; font-size: 0.85rem;">&larr; Return to Staff Portal</a>
    </div>
  </header>

  <main style="max-width: 900px; margin: 3rem auto; padding: 0 2rem;">
    
    <!-- Add New Priority Item Form -->
    <div style="background: #1e293b; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); padding: 1.5rem; margin-bottom: 2rem;">
      <h3 style="color: #ffffff; font-size: 1.2rem; margin-top: 0; margin-bottom: 1rem;">Add Priority Item</h3>
      <form onsubmit="handleNewPriority(event)">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
          <div>
            <label style="display: block; color: #cbd5e1; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.3rem;">Category</label>
            <select id="priorityCat" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white;">
              <option value="Maintenance">Maintenance &amp; Repairs</option>
              <option value="Bids">Pending Bids</option>
              <option value="Intake">Participant Intake</option>
            </select>
          </div>
          <div>
            <label style="display: block; color: #cbd5e1; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.3rem;">Urgency / Status</label>
            <select id="priorityStatus" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white;">
              <option value="High">High Priority</option>
              <option value="In Progress">In Progress</option>
              <option value="Pending">Pending Review</option>
            </select>
          </div>
        </div>

        <div style="margin-bottom: 1rem;">
          <label style="display: block; color: #cbd5e1; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.3rem;">Task Description</label>
          <input type="text" id="priorityDesc" required placeholder="e.g., Replace chainsaw bar oil pumps or finalize Santiam bid paperwork..." style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box;">
        </div>

        <button type="submit" style="background: #27ae60; color: white; border: none; padding: 0.6rem 1.25rem; border-radius: 6px; font-weight: 700; cursor: pointer;">Add to Ledger</button>
      </form>
    </div>
<!-- Staff Goal Management Card -->
<div style="background: #1e293b; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); padding: 1.5rem; margin-bottom: 2rem;">
  <h3 style="color: #ffffff; font-size: 1.2rem; margin-top: 0; margin-bottom: 1rem;">Update Public Expansion Goal Tracker</h3>
  <form onsubmit="updatePublicGoal(event)">
    <div style="margin-bottom: 1rem;">
      <label style="display: block; color: #cbd5e1; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.3rem;">Goal Title</label>
      <input type="text" id="adminGoalTitle" required value="Santiam Phase II Tool Cache Completion" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white;">
    </div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
      <div>
        <label style="display: block; color: #cbd5e1; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.3rem;">Progress Percentage (0-100)</label>
        <input type="number" id="adminGoalPercent" min="0" max="100" required value="85" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white;">
      </div>
      <div>
        <label style="display: block; color: #cbd5e1; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.3rem;">Status Text / Remaining Need</label>
        <input type="text" id="adminGoalStatus" required value="Only $450 needed to cross the finish line!" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white;">
      </div>
    </div>

    <div style="margin-bottom: 1rem;">
      <label style="display: block; color: #cbd5e1; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.3rem;">Description</label>
      <textarea id="adminGoalDesc" required rows="2" style="width: 100%; padding: 0.6rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; resize: vertical;">Help us secure the final specialized rigging gear to get our next veteran cohort fully equipped in the field.</textarea>
    </div>

    <button type="submit" style="background: #27ae60; color: white; border: none; padding: 0.6rem 1.25rem; border-radius: 6px; font-weight: 700; cursor: pointer;">Update Live Goal Bar</button>
  </form>
</div>

<script>
  function updatePublicGoal(event) {
    event.preventDefault();
    let goalData = {
      title: document.getElementById("adminGoalTitle").value.trim(),
      percentage: document.getElementById("adminGoalPercent").value,
      statusText: document.getElementById("adminGoalStatus").value.trim(),
      desc: document.getElementById("adminGoalDesc").value.trim()
    };
    localStorage.setItem("vrp_goal", JSON.stringify(goalData));
    alert("Public expansion goal successfully updated!");
  }
</script>
    <!-- Active Priorities List -->
    <h3 style="color: #ffffff; font-size: 1.3rem; margin-bottom: 1rem;">Active Operational Priorities</h3>
    <div id="priorityContainer" style="display: flex; flex-direction: column; gap: 1rem;">
      <!-- Populated via script -->
    </div>

  </main>

  <script>
    function renderPriorities() {
      let container = document.getElementById("priorityContainer");
      let stored = localStorage.getItem("vrp_priorities");
      let priorities = stored ? JSON.parse(stored) : [
        { cat: "Maintenance", status: "High", desc: "Service 0800 tool cache and sharpen crosscut saws." },
        { cat: "Bids", status: "Pending", desc: "Finalize sub-contract layout for Linn County property defensible space." },
        { cat: "Intake", status: "In Progress", desc: "Verify DD-214 records and emergency contacts for incoming cohort." }
      ];

      container.innerHTML = "";
      priorities.forEach((item, index) => {
        let card = document.createElement("div");
        card.style.cssText = "background: #1e293b; padding: 1.25rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;";
        card.innerHTML = `
          <div>
            <span style="background: rgba(99,179,237,0.15); color: #63b3ed; font-size: 0.75rem; font-weight: 800; padding: 0.2rem 0.6rem; border-radius: 12px; text-transform: uppercase;">${item.cat}</span>
            <span style="background: rgba(239,68,68,0.15); color: #ef4444; font-size: 0.75rem; font-weight: 800; padding: 0.2rem 0.6rem; border-radius: 12px; margin-left: 0.5rem;">${item.status}</span>
            <p style="color: #f8fafc; font-size: 0.95rem; margin: 0.5rem 0 0 0;">${item.desc}</p>
          </div>
          <button onclick="removePriority(${index})" style="background: #334155; color: #cbd5e1; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem;">Complete</button>
        `;
        container.appendChild(card);
      });
    }

    function handleNewPriority(event) {
      event.preventDefault();
      let newItem = {
        cat: document.getElementById("priorityCat").value,
        status: document.getElementById("priorityStatus").value,
        desc: document.getElementById("priorityDesc").value.trim()
      };
      let priorities = JSON.parse(localStorage.getItem("vrp_priorities") || "[]");
      priorities.unshift(newItem);
      localStorage.setItem("vrp_priorities", JSON.stringify(priorities));
      event.target.reset();
      renderPriorities();
    }

    function removePriority(index) {
      let priorities = JSON.parse(localStorage.getItem("vrp_priorities") || "[]");
      priorities.splice(index, 1);
      localStorage.setItem("vrp_priorities", JSON.stringify(priorities));
      renderPriorities();
    }

    window.addEventListener('load', renderPriorities);
  </script>
</body>
</html>
